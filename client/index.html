<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>La Derma Aesthetic Clinic</title>
    <meta name="description" content="La Derma Aesthetic Clinic presents laser hair treatment, Endolift, fillers, and Botox within a modern premium clinic experience.">
    <link rel="canonical" href="https://ladermaaesthatic.com/">

    <!-- Baseline Open Graph / Twitter card tags — overridden per page at
         runtime by the useSeo hook (see src/hooks/useSeo.js), but present
         here too so a crawler or link-preview bot that doesn't execute JS
         still gets a sensible default. -->
    <meta property="og:site_name" content="La Derma Aesthetic Clinic">
    <meta property="og:type" content="website">
    <meta property="og:title" content="La Derma Aesthetic Clinic">
    <meta property="og:description" content="La Derma Aesthetic Clinic presents laser hair treatment, Endolift, fillers, and Botox within a modern premium clinic experience.">
    <meta property="og:url" content="https://ladermaaesthatic.com/">
    <meta property="og:image" content="https://ladermaaesthatic.com/la-derma-logo.jpg">
    <meta name="twitter:card" content="summary">

    <link rel="icon" type="image/jpeg" href="/la-derma-logo.jpg">
    <link rel="apple-touch-icon" href="/la-derma-logo.jpg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Structured data (schema.org MedicalBusiness) — helps Google
         understand this is a real local business with an address, phone
         number and opening structure, which feeds into how it can show up
         in Maps and local search results, separately from ordinary organic
         ranking. -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "WebSite",
          "@id": "https://ladermaaesthatic.com/#website",
          "url": "https://ladermaaesthatic.com/",
          "name": "La Derma Aesthetic Clinic",
          "alternateName": "La Derma"
        },
        {
          "@type": "MedicalBusiness",
          "@id": "https://ladermaaesthatic.com/#clinic",
          "name": "La Derma Aesthetic Clinic",
          "image": "https://ladermaaesthatic.com/la-derma-logo.jpg",
          "logo": "https://ladermaaesthatic.com/la-derma-logo.jpg",
          "url": "https://ladermaaesthatic.com/",
          "telephone": "+447745756448",
          "sameAs": [
            "https://www.facebook.com/people/La-Derma-Aesthetic-Clinic/100085383892345/",
            "https://www.instagram.com/ladermaaesthetic"
          ],
          "address": {
            "@type": "PostalAddress",
            "streetAddress": "19 Jackson Street",
            "addressLocality": "Gateshead",
            "postalCode": "NE8 1EE",
            "addressCountry": "GB"
          }
        }
      ]
    }
    </script>
    <!-- Instant splash — shown from the very first paint, before the
         JavaScript bundle has downloaded. React replaces everything inside
         #root the moment it mounts, so this disappears on its own. -->
    <style>
      html, body { margin: 0; background: #FAF6EF; }
      .boot { position: fixed; inset: 0; display: grid; place-items: center; background: #FAF6EF; }
      .boot-mark { position: relative; width: 84px; height: 84px; display: grid; place-items: center; }
      .boot-mark img { width: 56px; height: 56px; border-radius: 50%; object-fit: cover; }
      .boot-ring { position: absolute; inset: 0; border-radius: 50%; border: 2px solid rgba(156,122,70,0.2); border-top-color: #BE9861; animation: boot-spin 1s linear infinite; }
      @keyframes boot-spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot" role="status" aria-label="Loading">
        <div class="boot-mark">
          <span class="boot-ring"></span>
          <img src="/la-derma-logo.jpg" alt="" width="56" height="56">
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
